<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ireland Cruise Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #5d6675;
    --border: #dde1e7;
    --accent: #1f6feb;
    --accent-soft: #e5efff;
    --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --panel: #1a1f27;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --border: #2c3340;
      --accent: #5b9bff;
      --accent-soft: #1d2b44;
      --chip: #252c37;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #sidebar {
    width: 360px;
    flex: none;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #sidebar header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  #sidebar h1 { font-size: 16px; margin: 0 0 2px; line-height: 1.3; }
  #sidebar header p { margin: 0; color: var(--muted); font-size: 12.5px; }
  #scroll { overflow-y: auto; flex: 1; min-height: 0; }
  section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  section h2 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 8px; font-weight: 600;
  }
  input[type="search"] {
    width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit;
  }
  .days { list-style: none; margin: 0; padding: 0; }
  .days li {
    padding: 7px 8px; border-radius: 6px; cursor: pointer; display: grid;
    grid-template-columns: 30px 1fr auto; gap: 2px 8px; align-items: baseline;
  }
  .days li:hover { background: var(--chip); }
  .days li.active { background: var(--accent-soft); }
  .days .num { font-weight: 700; color: var(--accent); grid-row: span 2; }
  .days .port { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .days .count { color: var(--muted); font-size: 12px; }
  .days .meta { color: var(--muted); font-size: 12px; grid-column: 2 / 4; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px;
    border-radius: 999px; background: var(--chip); border: 1px solid transparent;
    cursor: pointer; user-select: none; font-size: 12.5px;
  }
  .chip input { display: none; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; }
  .chip.off { opacity: .4; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { flex: 1; }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  .btn {
    font: inherit; font-size: 12.5px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  .btn:hover { background: var(--chip); }
  #status { color: var(--muted); font-size: 12.5px; }
  #map { flex: 1; min-width: 0; }
  #toggle { display: none; }

  /* Popups */
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.45; }
  .pop h3 { margin: 0 0 2px; font-size: 15px; }
  .pop .sub { color: #5d6675; font-size: 12px; margin-bottom: 6px; }
  .pop .note { margin: 4px 0 8px; }
  .pop ul { margin: 4px 0 0; padding-left: 16px; }
  .pop li { margin-bottom: 5px; }
  .pop .facts { color: #5d6675; font-size: 12px; }
  .pop .warn { color: #9a5b00; font-size: 12px; margin-top: 6px; }
  .pop table { border-collapse: collapse; font-size: 12.5px; }
  .pop td { padding: 1px 8px 1px 0; vertical-align: top; }
  .day-label {
    background: var(--accent); color: #fff; border-radius: 50%; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: 12px; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .day-label.multi { width: auto; border-radius: 12px; padding: 0 7px; white-space: nowrap; }

  @media (max-width: 760px) {
    body { flex-direction: column-reverse; }
    #sidebar { width: 100%; height: 45vh; border-right: 0; border-top: 1px solid var(--border); }
    #sidebar.collapsed { height: auto; }
    #sidebar.collapsed #scroll { display: none; }
    #toggle { display: inline-block; float: right; }
    #map { flex: 1; }
  }
</style>
</head>
<body>
<aside id="sidebar">
  <header>
    <button class="btn" id="toggle" type="button">Hide</button>
    <h1>11-Day Wild British Isles: Ireland &amp; Cliffs of Moher</h1>
    <p>Zuiderdam, Amsterdam round trip, June 22 to July 3, 2027</p>
  </header>
  <div id="scroll">
    <section>
      <input type="search" id="search" placeholder="Search places and excursions">
      <div class="row" style="margin-top:8px"><span id="status"></span></div>
    </section>
    <section>
      <h2>Days</h2>
      <ul class="days" id="days"></ul>
    </section>
    <section>
      <h2>Place types</h2>
      <div class="chips" id="categories"></div>
      <div class="row" style="margin-top:10px">
        <label><input type="checkbox" id="passby" checked> Include places only seen in passing</label>
      </div>
    </section>
    <section>
      <h2>Excursion filters</h2>
      <div class="row">
        <span>Max price</span>
        <input type="range" id="price" min="0" max="100" step="5">
        <span id="priceLabel" style="width:64px;text-align:right"></span>
      </div>
      <div class="chips" id="levels" style="margin:8px 0"></div>
      <div class="row">
        <label><input type="checkbox" id="wheelchair"> Wheelchair accessible only</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="noexc" checked> Show places with no excursion</label>
      </div>
      <div class="row"><button class="btn" id="reset" type="button">Reset filters</button></div>
    </section>
  </div>
</aside>
<div id="map" role="region" aria-label="Cruise map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="map-data.js"></script>
<script>
(function () {
  "use strict";
  const DATA = window.CRUISE_DATA;
  const EXC = DATA.excursions;
  const FEATURES = DATA.geojson.features;
  const DAYS = DATA.geojson.days;

  const CATEGORY = {
    town:       { label: "Towns", one: "Town",            color: "#4c6ef5" },
    castle:     { label: "Castles", one: "Castle",          color: "#9c36b5" },
    historic:   { label: "Historic sites", one: "Historic site",   color: "#c2255c" },
    religious:  { label: "Churches & abbeys", one: "Church or abbey",color: "#e8590c" },
    museum:     { label: "Museums", one: "Museum",          color: "#2b8a3e" },
    nature:     { label: "Nature", one: "Nature",           color: "#0ca678" },
    garden:     { label: "Gardens & estates", one: "Garden or estate",color: "#74b816" },
    distillery: { label: "Distilleries", one: "Distillery",     color: "#a0522d" },
    viewpoint:  { label: "Viewpoints", one: "Viewpoint",       color: "#1098ad" },
    food:       { label: "Food & drink", one: "Food and drink",     color: "#f08c00" },
    other:      { label: "Other", one: "Other",            color: "#868e96" }
  };
  const LEG_COLORS = ["#1f6feb", "#0b7285", "#5f3dc4", "#c92a2a", "#2b8a3e",
                      "#e67700", "#862e9c", "#1864ab", "#a61e4d"];

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));

  // ---------- Map ----------
  const map = L.map("map", { zoomControl: true, preferCanvas: false });
  window.cruiseMap = map;  // handy for inspection from the browser console
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"
  }).addTo(map);

  const routeLayer = L.layerGroup().addTo(map);
  const portLayer = L.layerGroup().addTo(map);
  const placeLayer = L.layerGroup().addTo(map);

  const routes = FEATURES.filter((f) => f.properties.kind === "route");
  const ports = FEATURES.filter((f) => f.properties.kind === "port");
  const places = FEATURES.filter((f) => f.properties.kind === "place");

  routes.forEach((f, i) => {
    const p = f.properties;
    const line = L.polyline(f.geometry.coordinates.map(([lon, lat]) => [lat, lon]), {
      color: LEG_COLORS[i % LEG_COLORS.length], weight: 3, opacity: 0.85, dashArray: "6 5"
    }).bindTooltip(esc(p.name), { sticky: true });
    line.feature = f;
    routeLayer.addLayer(line);
  });

  function portPopup(p) {
    const rows = p.calls.map((c) =>
      "<tr><td><b>Day " + c.day + "</b></td><td>" + esc(c.date) + "</td><td>" +
      (c.arrive ? "Arrive " + esc(c.arrive) : "") + (c.arrive && c.depart ? ", " : "") +
      (c.depart ? "Depart " + esc(c.depart) : "") + "</td></tr>" +
      (c.flags.length ? "<tr><td></td><td colspan=\"2\" class=\"facts\">" + esc(c.flags.join("; ")) + "</td></tr>" : "")
    ).join("");
    const links = p.calls.map((c) => {
      const d = DAYS.find((x) => x.day === c.day);
      return "<a href=\"" + esc(d.day_file) + "\">Day " + c.day + " details</a>";
    }).join(" | ");
    const nexc = p.calls.reduce((a, c) => a + c.excursion_count, 0);
    return "<div class=\"pop\"><h3>" + esc(p.name) + "</h3>" +
      "<div class=\"sub\">Port" + (nexc ? ", " + nexc + " shore excursions" : "") + "</div>" +
      "<table>" + rows + "</table><div style=\"margin-top:6px\">" + links + "</div></div>";
  }

  ports.forEach((f) => {
    const p = f.properties;
    const [lon, lat] = f.geometry.coordinates;
    const label = p.days.join(" / ");
    const icon = L.divIcon({
      className: "",
      html: "<div class=\"day-label" + (p.days.length > 1 ? " multi" : "") + "\">" + esc(label) + "</div>",
      iconSize: null, iconAnchor: [12, 12]
    });
    const m = L.marker([lat, lon], { icon: icon, zIndexOffset: 1000, title: p.name })
      .bindPopup(portPopup(p), { maxWidth: 320 });
    m.feature = f;
    portLayer.addLayer(m);
  });

  // ---------- Filters ----------
  const state = {
    day: null,
    search: "",
    categories: new Set(Object.keys(CATEGORY)),
    passby: true,
    maxPrice: null,
    levels: new Set(),
    wheelchair: false,
    noexc: true
  };

  const prices = Object.values(EXC).map((e) => e.price).filter((x) => x != null);
  const PRICE_MAX = Math.ceil(Math.max.apply(null, prices) / 25) * 25;
  const priceInput = document.getElementById("price");
  priceInput.max = PRICE_MAX;
  priceInput.value = PRICE_MAX;
  state.maxPrice = PRICE_MAX;

  const LEVELS = Array.from(new Set(Object.values(EXC).map((e) => e.activity_level).filter(Boolean)));
  const LEVEL_ORDER = ["Easy", "Moderate", "Strenuous"];
  LEVELS.sort((a, b) => (LEVEL_ORDER.indexOf(a) + 1 || 9) - (LEVEL_ORDER.indexOf(b) + 1 || 9));
  LEVELS.forEach((l) => state.levels.add(l));

  function excursionPasses(e) {
    if (!e) return false;
    if (e.price != null && e.price > state.maxPrice) return false;
    if (e.activity_level && !state.levels.has(e.activity_level)) return false;
    if (state.wheelchair && e.wheelchair_accessible !== "Yes") return false;
    return true;
  }

  function placeMatches(f) {
    const p = f.properties;
    if (state.day != null && p.day !== state.day) return false;
    if (!state.categories.has(p.category)) return false;
    if (!state.passby && p.visit === "passby") return false;
    const excs = p.excursion_ids.map((id) => EXC[id]).filter(Boolean);
    if (excs.length === 0) {
      if (!state.noexc) return false;
    } else if (!excs.some(excursionPasses)) {
      return false;
    }
    if (state.search) {
      const hay = [p.name, p.note, p.category].concat(excs.map((e) => e.title)).join(" ").toLowerCase();
      if (hay.indexOf(state.search) === -1) return false;
    }
    return true;
  }

  function placePopup(p) {
    const cat = CATEGORY[p.category] || CATEGORY.other;
    const day = DAYS.find((d) => d.day === p.day);
    const excs = p.excursion_ids.map((id) => EXC[id]).filter(Boolean);
    let html = "<div class=\"pop\"><h3>" + esc(p.name) + "</h3>" +
      "<div class=\"sub\">" + esc(cat.one) + " | Day " + p.day + ", " +
      esc(day.stops[0].name.split(",")[0]) + (p.visit === "passby" ? " | seen in passing" : "") + "</div>";
    if (p.note) html += "<div class=\"note\">" + esc(p.note) + "</div>";
    if (excs.length) {
      html += "<b>Excursions (" + excs.length + ")</b><ul>" + excs.map((e) =>
        "<li" + (excursionPasses(e) ? "" : " style=\"opacity:.5\"") + "><a href=\"" + esc(e.url) +
        "\" target=\"_blank\" rel=\"noopener\">" + esc(e.title) + "</a><div class=\"facts\">" +
        [e.price != null ? "$" + e.price : "", e.duration, e.activity_level,
         e.wheelchair_accessible === "Yes" ? "Wheelchair accessible" : ""]
          .filter(Boolean).map(esc).join(" | ") + "</div></li>").join("") + "</ul>";
    } else {
      html += "<div class=\"facts\">Mentioned in the port description</div>";
    }
    html += "<div style=\"margin-top:6px\"><a href=\"" + esc(p.day_file) + "\">Day " + p.day + " details</a></div>";
    if (p.location_check !== "verified") {
      html += "<div class=\"warn\">Location is approximate</div>";
    }
    return html + "</div>";
  }

  const placeMarkers = places.map((f) => {
    const p = f.properties;
    const [lon, lat] = f.geometry.coordinates;
    const cat = CATEGORY[p.category] || CATEGORY.other;
    const m = L.circleMarker([lat, lon], {
      radius: p.visit === "passby" ? 4.5 : 6.5,
      color: "#fff", weight: 1.5, fillColor: cat.color,
      fillOpacity: p.visit === "passby" ? 0.65 : 0.95
    }).bindTooltip(esc(p.name), { direction: "top", offset: [0, -4] });
    m.on("click", () => m.bindPopup(placePopup(p), { maxWidth: 320 }).openPopup());
    m.feature = f;
    return m;
  });

  function render(fit) {
    placeLayer.clearLayers();
    const shown = [];
    placeMarkers.forEach((m) => {
      if (placeMatches(m.feature)) { placeLayer.addLayer(m); shown.push(m); }
    });
    // Highlight the route legs touching the selected day.
    routeLayer.eachLayer((l) => {
      const p = l.feature.properties;
      const on = state.day == null || p.from_day === state.day || p.to_day === state.day ||
        (state.day > p.from_day && state.day < p.to_day);
      l.setStyle({ opacity: on ? 0.9 : 0.25, weight: on ? 3.5 : 2.5 });
    });
    document.getElementById("status").textContent =
      shown.length + " of " + placeMarkers.length + " places shown" +
      (state.day != null ? " for day " + state.day : "");
    document.querySelectorAll("#days li").forEach((li) =>
      li.classList.toggle("active", Number(li.dataset.day) === state.day ||
        (li.dataset.day === "all" && state.day == null)));
    if (fit) fitView(shown);
  }

  function fitView(shown) {
    let bounds;
    if (state.day == null) {
      bounds = L.latLngBounds([]);
      routeLayer.eachLayer((l) => bounds.extend(l.getBounds()));
    } else {
      bounds = L.latLngBounds([]);
      shown.forEach((m) => bounds.extend(m.getLatLng()));
      portLayer.eachLayer((m) => {
        if (m.feature.properties.days.indexOf(state.day) !== -1) bounds.extend(m.getLatLng());
      });
      if (!bounds.isValid()) {
        routeLayer.eachLayer((l) => {
          const p = l.feature.properties;
          if (state.day > p.from_day && state.day < p.to_day) bounds.extend(l.getBounds());
        });
      }
    }
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12 });
  }

  // ---------- Sidebar ----------
  const daysEl = document.getElementById("days");
  const all = document.createElement("li");
  all.dataset.day = "all";
  all.innerHTML = "<span class=\"num\">All</span><span class=\"port\">Whole voyage</span>" +
    "<span class=\"count\">" + placeMarkers.length + "</span><span class=\"meta\">Jun 22 to Jul 3, 2027</span>";
  daysEl.appendChild(all);
  DAYS.forEach((d) => {
    const li = document.createElement("li");
    li.dataset.day = d.day;
    const s = d.stops[0];
    const names = d.stops.map((x) => x.name.split(",")[0]).join(" + ");
    const times = [s.arrive && "arr " + s.arrive, s.depart && "dep " + s.depart].filter(Boolean).join(", ");
    const n = places.filter((f) => f.properties.day === d.day).length;
    li.innerHTML = "<span class=\"num\">" + d.day + "</span><span class=\"port\">" + esc(names) + "</span>" +
      "<span class=\"count\">" + (n || "") + "</span>" +
      "<span class=\"meta\">" + esc(d.date) + (times ? " | " + esc(times) : "") + "</span>";
    daysEl.appendChild(li);
  });
  daysEl.addEventListener("click", (ev) => {
    const li = ev.target.closest("li");
    if (!li) return;
    state.day = li.dataset.day === "all" ? null : Number(li.dataset.day);
    render(true);
  });

  const catEl = document.getElementById("categories");
  const usedCats = new Set(places.map((f) => f.properties.category));
  Object.keys(CATEGORY).filter((k) => usedCats.has(k)).forEach((k) => {
    const lab = document.createElement("label");
    lab.className = "chip";
    lab.innerHTML = "<input type=\"checkbox\" checked><span class=\"dot\" style=\"background:" +
      CATEGORY[k].color + "\"></span>" + esc(CATEGORY[k].label);
    lab.querySelector("input").addEventListener("change", (ev) => {
      if (ev.target.checked) state.categories.add(k); else state.categories.delete(k);
      lab.classList.toggle("off", !ev.target.checked);
      render(false);
    });
    catEl.appendChild(lab);
  });

  const lvlEl = document.getElementById("levels");
  LEVELS.forEach((l) => {
    const lab = document.createElement("label");
    lab.className = "chip";
    lab.innerHTML = "<input type=\"checkbox\" checked>" + esc(l);
    lab.querySelector("input").addEventListener("change", (ev) => {
      if (ev.target.checked) state.levels.add(l); else state.levels.delete(l);
      lab.classList.toggle("off", !ev.target.checked);
      render(false);
    });
    lvlEl.appendChild(lab);
  });

  // Hide the wheelchair filter when no excursion is listed as accessible.
  if (!Object.values(EXC).some((e) => e.wheelchair_accessible === "Yes")) {
    document.getElementById("wheelchair").closest(".row").style.display = "none";
  }

  const priceLabel = document.getElementById("priceLabel");
  function updatePriceLabel() {
    priceLabel.textContent = state.maxPrice >= PRICE_MAX ? "Any" : "$" + state.maxPrice;
  }
  priceInput.addEventListener("input", () => {
    state.maxPrice = Number(priceInput.value);
    updatePriceLabel();
    render(false);
  });
  updatePriceLabel();

  document.getElementById("search").addEventListener("input", (ev) => {
    state.search = ev.target.value.trim().toLowerCase();
    render(false);
  });
  [["passby", "passby"], ["wheelchair", "wheelchair"], ["noexc", "noexc"]].forEach(([id, key]) => {
    document.getElementById(id).addEventListener("change", (ev) => {
      state[key] = ev.target.checked;
      render(false);
    });
  });
  document.getElementById("reset").addEventListener("click", () => {
    state.categories = new Set(Object.keys(CATEGORY));
    state.levels = new Set(LEVELS);
    state.maxPrice = PRICE_MAX;
    state.wheelchair = false;
    state.passby = true;
    state.noexc = true;
    state.search = "";
    priceInput.value = PRICE_MAX;
    updatePriceLabel();
    document.getElementById("search").value = "";
    document.querySelectorAll("#sidebar input[type=checkbox]").forEach((c) => {
      c.checked = c.id !== "wheelchair";
    });
    document.querySelectorAll(".chip").forEach((c) => c.classList.remove("off"));
    render(false);
  });

  const sidebar = document.getElementById("sidebar");
  document.getElementById("toggle").addEventListener("click", (ev) => {
    sidebar.classList.toggle("collapsed");
    ev.target.textContent = sidebar.classList.contains("collapsed") ? "Show" : "Hide";
    setTimeout(() => map.invalidateSize(), 50);
  });

  render(true);
})();
</script>
</body>
</html>
